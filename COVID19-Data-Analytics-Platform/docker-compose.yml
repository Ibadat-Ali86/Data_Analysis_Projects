version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: covid_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: covid_db
      MYSQL_USER: ibadat
      MYSQL_PASSWORD: ibadat
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - covid_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # FastAPI Backend
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: covid_backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_USER=ibadat
      - DB_PASSWORD=ibadat
      - DB_NAME=covid_db
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - covid_network
    volumes:
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: covid_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - covid_network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:

networks:
  covid_network:
    driver: bridge

